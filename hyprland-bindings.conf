# notch-shell IPC bindings — merge into ~/.config/hypr/hyprland.conf
# Check for existing key conflicts before adding.
$notchIpc = qs ipc -p /usr/share/notch-shell
bind = SUPER, C, exec, $notchIpc call controlCenter toggle
bind = SUPER, V, exec, $notchIpc call cliphist toggle
bind = SUPER, R, exec, $notchIpc call appLauncher toggle
bind = SUPER, W, exec, $notchIpc call wallpaperSwitcher toggle
bind = SUPER, T, exec, $notchIpc call themePicker toggle
bind = SUPER, Y, exec, $notchIpc call weather toggle
bind = SUPER, ESCAPE, exec, $notchIpc call powerMenu toggle
bind = SUPER CTRL, B, exec, $notchIpc call miniDashboard toggle

# Start at login; add only once.
exec-once = notch-shell
